# Comprueba que los documentos bilingues (ARCHITECTURE.md / ARQUITECTURA.md) siguen alineados:
# misma linea "Synced with:" y mismo esqueleto de secciones. No compila nada.
name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check_docs_sync.py']
  pull_request:
    paths: ['docs/**', 'scripts/check_docs_sync.py']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bilingual docs in sync
        run: python3 scripts/check_docs_sync.py
